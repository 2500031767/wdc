<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard — Women Development Cell, KLEF</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>

<div class="admin" id="app">
  <aside class="side">
    <h1>WDC admin</h1>
    <p class="who">Content editor</p>
    <div id="tabs"></div>
    <div class="group">Elsewhere</div>
    <button class="tab" type="button" onclick="window.open('index.html','_blank')">Open the site</button>
    <button class="tab" type="button" id="signOut">Sign out</button>
  </aside>

  <main class="work" id="work"></main>

  <div class="savebar">
    <button class="btn btn-primary" id="saveBtn" type="button">Save changes</button>
    <button class="btn btn-line" id="previewBtn" type="button">Preview site</button>
    <span class="status" id="status"></span>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="assets/js/firebase.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
